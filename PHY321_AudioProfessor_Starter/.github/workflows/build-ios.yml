name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-iphone:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Select installed Xcode
        run: |
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS project
        run: xcodegen generate
      - name: Build unsigned app for real iPhones
        run: |
          xcodebuild \
            -project PHY321AudioProfessor.xcodeproj \
            -scheme PHY321AudioProfessor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/output" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned IPA for Sideloadly signing
        run: |
          mkdir -p Payload
          cp -R output/Build/Products/Release-iphoneos/PHY321AudioProfessor.app Payload/
          zip -qry PHY321AudioProfessor-unsigned.ipa Payload
          unzip -l PHY321AudioProfessor-unsigned.ipa | head -20
      - name: Attach IPA to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: PHY321AudioProfessor-unsigned-ipa
          path: PHY321AudioProfessor-unsigned.ipa
          retention-days: 14
